<!-- Supabase: Authentication -> Email Templates -> "Magic Link" AND "Confirm signup" (paste into both).
     Subject: Your Clout City code: {{ .Token }}
     v0.11: the 6-digit code comes first (the installed app signs in with it, since email links open
     the browser); the link stays below for signing in on the browser. -->
<div style="background:#14111A;padding:32px 20px;font-family:Inter,Arial,sans-serif;color:#FFF6E0;text-align:center">
  <p style="font-size:13px;letter-spacing:2px;text-transform:uppercase;color:#E1BC85;margin:0 0 8px">Clout City NYC</p>
  <h1 style="font-size:24px;margin:0 0 12px;color:#FFF6E0">Tap in.</h1>
  <p style="font-size:15px;line-height:21px;margin:0 0 16px;color:#FFF6E0">
    Your sign-in code. Type it in the game. No password, no velvet rope.
  </p>
  <p style="font-size:40px;letter-spacing:10px;font-weight:700;margin:0 0 8px;color:#FFC21A;font-family:Menlo,Consolas,monospace">{{ .Token }}</p>
  <p style="font-size:13px;line-height:18px;margin:0 0 28px;color:rgba(255,246,224,.7)">It works once and expires in an hour.</p>
  <p style="font-size:13px;line-height:18px;margin:0 0 12px;color:rgba(255,246,224,.7)">Playing in a browser instead? Tap the button:</p>
  <a href="{{ .SiteURL }}/auth/confirm?token_hash={{ .TokenHash }}&type=email"
     style="display:inline-block;background:#FFC21A;color:#14111A;font-weight:600;font-size:16px;padding:12px 24px;border-radius:16px;text-decoration:none">
    Sign in to Clout City
  </a>
  <p style="font-size:12px;line-height:16px;margin:24px 0 0;color:rgba(255,246,224,.6)">
    Didn't ask for this? Ignore it and nothing happens.
  </p>
</div>
